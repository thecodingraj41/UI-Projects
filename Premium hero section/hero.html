<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="hero.css" />
  </head>
  <body>
    <section class="hero">
      <div class="left">
        <span class="tag">🚀 Build Modern Websites Faster</span>
        <h1>Create Beautiful Websites With Modern UI Design</h1>
        <p>
          Learn frontend development by building real world projects using HTML
          and CSS from beginner to advanced level.
        </p>
        <div class="buttons">
          <button class="btn primary">Get Started</button>
          <button class="btn secondary">Watch Demo</button>
        </div>
        <div class="stats">
          <div class="box">
            <h2>10k+</h2>
            <span>Developer</span>
          </div>
          <div class="box">
            <h2>500+</h2>
            <span>Projects</span>
          </div>
          <div class="box">
            <h2>99%</h2>
            <span>Satisfications</span>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="main-card">
          <img src="https://graphicsfamily.com/wp-content/uploads/edd/2021/12/Free-Business-Card-Design-Gold-And-Black-Colors-1180x885.jpg" alt="">
          <div class="top">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <div class="content">
            <div class="line long"></div>
            <div class="line medium"></div>
            <div class="line short"></div>
            <button>Create Project</button>
          </div>
        </div>
        <div class="floating users">10K+ Users</div>
        <div class="floating rating">⭐ 4.9 Rating</div>
      </div>
    </section>
  </body>
</html>
